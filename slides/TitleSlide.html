<!-- @dsCard group="Slides" viewport="1280x720" name="Title" subtitle="Opens a deck. Wordmark, one statement, date and audience in mono." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-app="seakim">
<head>
<meta charset="utf-8">
<title>Title</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  .slide {
    width: 1280px; height: 720px; box-sizing: border-box;
    background: var(--surface-page);
    display: flex; flex-direction: column;
    padding: 64px 72px;
    position: relative; overflow: hidden;
  }
  .eyebrow {
    font: var(--type-eyebrow); font-size: 14px; text-transform: uppercase;
    letter-spacing: var(--tracking-caps); color: var(--text-tertiary);
  }
  .wordmark {
    position: absolute; left: 72px; bottom: 40px;
    font-family: var(--font-display); font-size: 20px; font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); color: var(--text-tertiary);
  }
  .pagenum {
    position: absolute; right: 72px; bottom: 40px;
    font-family: var(--font-mono); font-size: 14px; color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .rule { height: 1px; background: var(--border-subtle); }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: var(--tracking-tighter); font-weight: var(--weight-semibold); }
  h2 { font-size: 56px; line-height: 1.08; letter-spacing: var(--tracking-tighter); font-weight: var(--weight-semibold); }
  h3 { font-size: 30px; line-height: 1.2; letter-spacing: var(--tracking-tight); font-weight: var(--weight-semibold); }
  p { font-size: 24px; line-height: 1.5; color: var(--text-secondary); max-width: 46ch; }

</style>
</head>
<body>
<div class="slide">
  <div class="eyebrow">SeaKim · internal · Q3 review</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:32px">
    <h1>Two apps,<br>one chassis</h1>
    <p style="font-size:28px;max-width:38ch;color:var(--text-secondary)">
      What shipping Voyage and Bench off a shared design system actually cost us — and what it bought.
    </p>
  </div>
  <div style="display:flex;align-items:flex-end;gap:48px">
    <div style="font-family:var(--font-mono);font-size:16px;color:var(--text-tertiary);letter-spacing:0.04em">
      12 SEP 2026 · DESIGN + ENG ALL HANDS
    </div>
  </div>
  <div class="wordmark">SeaKim</div>
</div>
</body>
</html>
