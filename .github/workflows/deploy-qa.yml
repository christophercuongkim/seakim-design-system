name: deploy-qa

# Deploy a branch to the shared QA slot. The Dokploy app builds from the `qa`
# branch, so "deploy branch X" = force-point `qa` at X, then trigger the webhook.
# Same shape as fantasy-hub's, minus the database — there is no DB here, so the
# prepare job is only the pointer move.
#
# Three triggers:
#   - pull_request (opened/synchronize/reopened) auto-deploys the PR's branch,
#     so a reviewer sees the change on QA before it merges.
#   - push to main auto-deploys the merged result, so QA tracks main once a PR
#     lands — no manual `qa` fast-forward.
#   - workflow_dispatch is the manual override — deploy a branch with no open PR,
#     or force a redeploy.
#
# Both event triggers share ONE path filter (the anchor below): only a change to
# something that renders redeploys. A docs/tooling/ADR-only change (a new gate, a
# decision) does not — QA would look byte-identical, so a multi-minute image
# rebuild would buy nothing. That is why a tooling PR shows no deploy check.
#
# QA is a SINGLE shared slot: one `qa` pointer, one app. With two PRs open, the
# last deployed is what is live. Deliberate — see docs/12-qa-environment.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: &render_paths
      - "tokens/**"
      - "components/**"
      - "ui_kits/**"
      - "next/**"
      - "index.js"
      - "index.d.ts"
      - "styles.css"
      - "index.html"
      - "ds-shim.js"
      # Flutter now renders on QA too, so its changes must trigger a deploy —
      # and they are the slow ones, since the image rebuilds the web bundle.
      - "flutter/**"
  push:
    branches: [main]
    paths: *render_paths
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to QA
        type: string
        default: main

# One QA deploy at a time; a newer run supersedes an in-flight one.
concurrency:
  group: deploy-qa
  cancel-in-progress: true

permissions:
  contents: write # force-push the chosen branch to `qa`

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_dispatch → inputs.branch; pull_request → the PR's head branch;
          # push → github.ref_name (main). head_ref is empty on a push event, so the
          # ref_name fallback is what makes the push trigger deploy main, not empty.
          ref: ${{ inputs.branch || github.head_ref || github.ref_name }}
          fetch-depth: 0 # full history so the force-push to `qa` isn't shallow

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cheap, and it means QA never serves a build whose tokens disagree with
      # their source. The Flutter suites are CI's job, not this one.
      - name: Gates
        run: |
          node tool/version-check.mjs
          node tool/build-tokens.mjs --check
          node tool/conformance-check.mjs

      - name: Point `qa` at the deployed branch
        run: git push --force origin HEAD:refs/heads/qa

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger the Dokploy QA deploy
        run: |
          curl --fail --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/qa"}' \
            "${{ secrets.DOKPLOY_DS_QA_WEBHOOK }}"
