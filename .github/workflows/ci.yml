name: CI

# The gates the design system defines for itself. Per TODO-manual.md, without
# the token check someone hand-edits a generated file and it silently reverts on
# the next build.
on:
  push:
    branches: [main]
  pull_request:
  # During the 2026-08-06 Actions incident a pull_request event never queued a run,
  # and there was no way to ask for one — rerunning replays the old commit, so the
  # only route was pushing another. Dispatch makes a re-run possible without one.
  workflow_dispatch:

jobs:
  rules:
    name: Tokens and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails if the generated CSS, Dart, or TS is stale relative to tokens/src/.
      - name: Token outputs are current
        run: node tool/build-tokens.mjs --check

      # Tier 0 rules are law — see conformance.md.
      - name: Conformance
        run: node tool/conformance-check.mjs

      # VERSION, package.json, and the CHANGELOG must not drift apart; and each
      # binding's seakim_rules must be honest (decision 0019).
      - name: Version consistency
        run: node tool/version-check.mjs

      # Static preview pre-filter — every component in the ds-shim registry and
      # declared in the preview manifest (decision 0020). Fast, no browser.
      - name: Preview coverage (static)
        run: node tool/preview-check.mjs

  preview:
    name: Preview render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The render gate loads each surface in headless Chrome and asserts it drew —
      # the class of bug the text gates never see (lessons 14, 15; decision 0020).
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # Build and serve /next (server-rendered, real DOM) on :3000. Mirrors the QA
      # Dockerfile's build.
      - name: Build and serve /next
        working-directory: next/example
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm start &
          npx --yes wait-on http://localhost:3000/next --timeout 120000

      # Build /flutter web and serve it under /flutter/ (static) on :8080. Same
      # build flags the Dockerfile deploys with, so the gate renders what ships.
      - name: Build and serve /flutter
        working-directory: flutter/example
        run: |
          flutter pub get
          flutter build web --release --base-href /flutter/ --pwa-strategy=none
          mkdir -p "$RUNNER_TEMP/srv/flutter"
          cp -r build/web/* "$RUNNER_TEMP/srv/flutter/"
          ( cd "$RUNNER_TEMP/srv" && python3 -m http.server 8080 & )
          npx --yes wait-on http://localhost:8080/flutter/ --timeout 120000

      # Root gallery cards + /next markers + /flutter boot, all in one Chrome pass.
      - name: Preview render gate
        env:
          NEXT_URL: http://localhost:3000/next
          FLUTTER_URL: http://localhost:8080/flutter/
        run: node tool/preview-check.mjs --render

  flutter:
    name: Flutter binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate the icon table
        working-directory: flutter
        run: dart run tool/gen_icons.dart

      - name: Analyze
        working-directory: flutter
        run: flutter analyze

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Example analyzes and tests
        working-directory: flutter/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
