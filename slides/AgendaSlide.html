<!-- @dsCard group="Slides" viewport="1280x720" name="Agenda" subtitle="Numbered list with the current item in accent. Never more than 6 rows." -->
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-app="seakim">
<head>
<meta charset="utf-8">
<title>Agenda</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  body { margin: 0; }
  .slide {
    width: 1280px; height: 720px; box-sizing: border-box;
    background: var(--surface-page);
    display: flex; flex-direction: column;
    padding: 64px 72px;
    position: relative; overflow: hidden;
  }
  .eyebrow {
    font: var(--type-eyebrow); font-size: 14px; text-transform: uppercase;
    letter-spacing: var(--tracking-caps); color: var(--text-tertiary);
  }
  .wordmark {
    position: absolute; left: 72px; bottom: 40px;
    font-family: var(--font-display); font-size: 20px; font-weight: var(--weight-semibold);
    letter-spacing: var(--tracking-tight); color: var(--text-tertiary);
  }
  .pagenum {
    position: absolute; right: 72px; bottom: 40px;
    font-family: var(--font-mono); font-size: 14px; color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .rule { height: 1px; background: var(--border-subtle); }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: var(--tracking-tighter); font-weight: var(--weight-semibold); }
  h2 { font-size: 56px; line-height: 1.08; letter-spacing: var(--tracking-tighter); font-weight: var(--weight-semibold); }
  h3 { font-size: 30px; line-height: 1.2; letter-spacing: var(--tracking-tight); font-weight: var(--weight-semibold); }
  p { font-size: 24px; line-height: 1.5; color: var(--text-secondary); max-width: 46ch; }
  .agenda { display:flex; align-items:baseline; gap:32px; padding:26px 0; }
  .agenda .n { font-family:var(--font-mono); font-size:18px; color:var(--text-tertiary); width:40px; }
  .agenda .t { font-family:var(--font-display); font-size:34px; font-weight:var(--weight-medium); letter-spacing:var(--tracking-tight); flex:1; }
  .agenda .m { font-family:var(--font-mono); font-size:16px; color:var(--text-tertiary); }
  .agenda.current .t { color: var(--text-accent); }
  .agenda.current .n { color: var(--fill-accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="eyebrow">Agenda</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:0">
    <div class="rule"></div>
    <div class="agenda"><span class="n">01</span><span class="t">Where the two apps overlapped</span><span class="m">5 min</span></div>
    <div class="rule"></div>
    <div class="agenda current"><span class="n">02</span><span class="t">What the shared layer had to give up</span><span class="m">8 min</span></div>
    <div class="rule"></div>
    <div class="agenda"><span class="n">03</span><span class="t">Token rotation in practice</span><span class="m">6 min</span></div>
    <div class="rule"></div>
    <div class="agenda"><span class="n">04</span><span class="t">What app three inherits for free</span><span class="m">4 min</span></div>
    <div class="rule"></div>
  </div>
  <div class="wordmark">SeaKim</div>
  <div class="pagenum">02 / 24</div>
</div>
</body>
</html>
