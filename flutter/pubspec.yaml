name: seakim_flutter
description: >-
  SeaKim design system for Flutter. Custom widgets built on Flutter primitives —
  square corners, hairline borders, shadows only on things that float. Colour
  values are generated from the CSS token layer; see tool/gen_tokens.dart.
version: 1.11.0

# The rules version this binding was reviewed against — see decisions/0011.
# A binding may lag the rules; it may not claim a version it has not been checked to.
seakim_rules: "4.2"
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    # Licence notices for the bundled fonts, loaded at runtime by
    # registerSkLicenses() so showLicensePage() can display them.
    - assets/icons/LICENSE-phosphor.txt
    - assets/fonts/OFL-Outfit.txt
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/fonts/OFL-IBMPlexMono.txt

  fonts:
    # Icon fonts. Bundled here rather than pulled from a package, because every
    # Flutter icon package subclasses IconData, which Flutter sealed in 3.27.
    # Code points are generated into lib/src/tokens/sk_icons.g.dart — keep the
    # two in step. Phosphor Icons, MIT: assets/icons/LICENSE-phosphor.txt
    - family: PhosphorRegular
      fonts:
        - asset: assets/icons/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/icons/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/icons/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/icons/Phosphor-Duotone.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
